{% extends 'layouts/main.html' %} 

{% block content %}
    <!--<button id="pay-btn">Pay Now</button>-->
    <div class="container my-5 py-4">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-md border p-4 text-center rounded-3">
                    <div class="mb-3">
                        <i class="fa-solid fa-credit-card fa-2x" style="color: #3399cc;"></i>
                    </div>
                     <h4 class="fw-bold mb-3">Order Checkout</h4>
                     <div class="bg-light p-3 rounded mb-3 text-start">
                        <p class="mb-1 text-muted small">Order ID:<strong class="text-dark">₹ {{ order.id }}</strong></p>
                        <p class="mb-1 text-muted small">Amount:<strong class="text-success fs-6">₹ {{ order.amount }}</strong></p>

                     </div>
                     <p class="text-muted small mb-4">Click below to proceed with Razorpay payment.</p>
                     <button id="pay-btn" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 " style="background-color:#3399cc;border:none;">
                        <i class="fa-solid fa-lock"></i> Pay Now
                     </button>
                </div>

            </div>
        </div>

    </div>

    <script>
        const options = {
            key: "{{ razorpay_key|escapejs }}",
            amount: "{{ order.amount }}",
            currency: "{{ order.currency }}",
            name: "Shopvex",
            description: "Order Payment",
            order_id: "{{ order.id }}",

            handler: function (response) {
                alert("Payment completed in Razorpay checkout!");
                console.log(response);
            },

            modal: {
                ondismiss: function () {
                    alert("Payment window closed.");
                }
            },

            theme: {
                color: "#3399cc"
            }
        };

        document.getElementById("pay-btn").onclick = function (e) {
            const checkout = new Razorpay(options);

            checkout.on("payment.failed", function (response) {
                alert("Payment failed: " +
                    response.error.description);
            });

            checkout.open();
            e.preventDefault();
        };
    </script>
{% endblock %}
