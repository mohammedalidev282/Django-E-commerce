{% extends 'layouts/main.html' %}
{% block title %}
ShopKart| Online Shopping
{% endblock title %}

{% block content %}

{% include 'inc/slider.html' %}


    <div class="container" style="margin-top: 60px;">
        <div class="row">
            <div class="col-12">
              <h1 class="mb-3 p-1" style="font-size:x-large;color: #5c5f61;">
                <i class="fa-solid fa-arrow-up-right-dots"></i>
                Latest Products
            </h1>
              <hr style="border-color:#b8bfc2;">
            </div>
            {% for items in I_Products  %}
            <div class="col-md-4 col-lg-3 mb-4">
                <a href="{% url 'product_details' items.category.name items.name %}" class="text-decoration-none text-dark">
                    <div class="card h-100 shadow-sm border-0 product-card">
                       <div class="img-container">
                         <img src="{{items.Pr_image.url}}" alt="{{items.name}}" class="card-img-top c-img">

                       </div>
                        <div class="card-body d-flex flex-column justify-content-between p-3">
                            <h5 class="card-title prduct-title mb-3">{{items.name}}</h5>
                            <div class="d-flex align-items-center justify-content-between">
                               <span class="old-price"><s>Rs.{{items.oldPrice}}</s></span> 
                               <span class="new-price">Rs.{{items.newPrice}}</s></span> 

                            </div>

                        </div>

                    </div>

                </a>

            </div>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
