{% extends 'layouts/main.html' %}
{% block title %}
Register | ShopKart
{% endblock title %}

{% block content %}

     <div class="container" style="margin-top:60px; min-height:680px;">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-2 mt-5" style="font-size:x-large; text-align:center;">User Login</h1>
                <hr style="border-color:#b8bfc2;">
                {% include 'inc/message.html'%}

            </div>
        </div>
        <section class="mt-3">
            <div class="container">
                <div class="row">
                    <div class="col-6">
                        <form method="post" action="">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">UserName:</label>
                                <input type="text" name="username" id="username" class="form-control" placeholder="Enter Your Username">
                                {% if form.errors.username %}
                                <label class="text-danger small mt-1">{{forms.errors.username}}</label>
                                {% endif %}
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password:</label>
                                <input type="password" name="password" id="password" class="form-control" placeholder="Enter Your Password">
                                {% if form.errors.password1 %}
                                <label class="text-danger small mt-1">{{forms.errors.password1}}</label>
                                {% endif %}
                            </div>
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-info btn-block">Login</button>
                            </div>
                            
                        </form>
                        
                    </div>
                </div>
            </div>
        </section>
        
        
    </div>
{% endblock content %}
